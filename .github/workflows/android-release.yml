name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: |
          npm run lint
          npm run typecheck
          npm run check:calculations

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nicotiny-${{ github.event_name }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          apk="nicotiny-${version}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          {
            cat release-notes.md
            echo
            echo "### APK"
            echo
            echo "- Версия: ${version}."
            echo "- Минимальная версия: Android 7.0 (API 24)."
            echo "- Подпись: debug; подходит для прямой установки и тестирования."
            echo "- SHA-256: \`$(sha256sum "$apk" | cut -d ' ' -f 1)\`"
          } > release-notes-full.md
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nicotiny ${version}" \
            --notes-file release-notes-full.md \
            --verify-tag
